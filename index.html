<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a16">
  <meta name="description" content="CULT7 is coming in 2027. A new experience is taking shape.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CULT7 — Coming in 2027">
  <meta property="og:description" content="Something big is shaping up. Stay close.">
  <title>CULT7 — Coming in 2027</title>
  <style>
    :root{color-scheme:dark; font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:#090a16;color:#f7f5f1}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 18%,#30224d 0%,transparent 44%),radial-gradient(ellipse at 5% 95%,#122e41 0%,transparent 45%),#090a16;display:flex;flex-direction:column}
    .bar{height:5px;background:linear-gradient(90deg,#8a5bff,#ee4f9b,#ffb766)}
    main{max-width:1100px;width:100%;margin:auto;padding:80px 34px 65px}
    .eyebrow{font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#c5accd;font-weight:800}
    .logo{font-weight:900;font-size:clamp(100px,20vw,230px);letter-spacing:-.115em;line-height:1;margin:30px 0 12px;text-shadow:0 22px 70px #cc65ff37}
    .logo span{background:linear-gradient(110deg,#f9f6ff 32%,#f4b8fc 69%,#ffbd8b);background-clip:text;-webkit-background-clip:text;color:transparent;padding-right:.13em}
    h1{font-weight:500;letter-spacing:-.045em;font-size:clamp(34px,5.8vw,72px);line-height:1.08;max-width:810px;margin:34px 0 25px}
    p{line-height:1.7;color:#bdbbc9;font-size:clamp(16px,2vw,20px);max-width:700px}
    .pill{display:inline-flex;border:1px solid #ffffff36;border-radius:100px;padding:12px 18px;color:#f6d9fa;letter-spacing:.13em;text-transform:uppercase;font-size:12px;font-weight:800;margin-top:22px}
    footer{border-top:1px solid #ffffff1b;padding:24px 34px;color:#9492a7;font-size:12px;letter-spacing:.08em;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    @media(max-width:650px){main{padding:55px 24px}.logo{font-size:clamp(95px,25vw,170px)}footer{padding:20px 24px}}
  </style>
</head>
<body>
  <div class="bar"></div>
  <main>
    <div class="eyebrow">Something big is shaping up</div>
    <div class="logo" aria-label="CULT7"><span>CULT7</span></div>
    <h1>Stay close.<br>Something unforgettable is on its way.</h1>
    <p>No spoilers. No explanations. Just a name, a date, and a promise: CULT7 is coming.</p>
    <div class="pill">Coming in 2027</div>
  </main>
  <footer><span>© CULT7 · All rights reserved</span><span>cult7.com</span></footer>
</body>
</html>
